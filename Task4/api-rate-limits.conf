http {
    # 1) Разные зоны с разными rate (по IP)
    limit_req_zone $binary_remote_addr zone=web_zone:10m    rate=50r/s;
    limit_req_zone $binary_remote_addr zone=mobile_zone:10m rate=30r/s;

    # 2) Определяем тип клиента
    #   Сначала пробуем заголовок X-Client-Type (рекомендуется выставлять его и в веб-, и в мобильном клиенте)
    map $http_x_client_type $hdr_is_mobile {
        default   0;
        "~*mobile" 1;
        "~*ios"    1;
        "~*android" 1;
    }

    #   Фолбэк по User-Agent (базовые сигнатуры нативных клиентов/веба)
    map $http_user_agent $ua_is_mobile {
        default                 0;
        "~*Android.*Mobile"     1;
        "~*iPhone|iPad|iPod"    1;
        "~*okhttp"              1;  # часто у Android-приложений
        "~*CFNetwork"           1;  # часто у iOS-приложений
    }

    #   Итоговый выбор варианта
    map "$hdr_is_mobile$ua_is_mobile" $api_variant {
        "~*1"   "mobile";  # если любой источник говорит "mobile"
        default "web";
    }

    server {
        listen 80;

        # Общая точка входа: переписываем на внутренние локации
        location /api/ {
            # /api/... -> /_mobile/api/... или /_web/api/... (в зависимости от $api_variant)
            rewrite ^/api/(.*)$ /_$api_variant/api/$1 last;
        }

        # ----- MOBILE -----
        location ^~ /_mobile/api/ {
            # Снимаем префикс, чтобы бэкенд видел оригинальный путь /api/...
            rewrite ^/_mobile(/api/.*)$ $1 break;

            # Лимит для мобильных клиентов: 30 r/s с одного IP
            limit_req zone=mobile_zone burst=200;
            limit_req_status 429;

            proxy_pass http://backend;
        }

        # ----- WEB -----
        location ^~ /_web/api/ {
            # Снимаем префикс, чтобы бэкенд видел оригинальный путь /api/...
            rewrite ^/_web(/api/.*)$ $1 break;

            # Лимит для веб-клиентов: 50 r/s с одного IP
            limit_req zone=web_zone burst=200;
            limit_req_status 429;

            proxy_pass http://backend;
        }
    }
}
