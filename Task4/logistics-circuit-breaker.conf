http {
    upstream logistics_backend {
        zone logistics_backend 64k;                         # общий runtime-state
        server logistics.company.com max_fails=5 fail_timeout=30s;  # 5 ошибок -> пауза 30s
        # keepalive 32;                                     # (опционально)
    }

    server {
        listen 8080;

        location /logistics/ {
            proxy_pass http://logistics_backend;

            # 1) Жёсткие таймауты
            proxy_connect_timeout 3s;
            proxy_send_timeout    3s;
            proxy_read_timeout    3s;

            # 2) Что считаем ошибкой для пассивного HC/счётчика отказов
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;

            # 3) Перехват ошибок и отдача fallback
            proxy_intercept_errors on;
            error_page 500 502 503 504 = @logistics_fallback;
        }

        # Fallback-ответ при открытом брейкере/ошибке бэкенда
        location @logistics_fallback {
            add_header X-Circuit-Breaker "open" always;
            add_header Retry-After 30 always;
            default_type application/json;
            return 200 '{"status":"degraded","message":"Logistics temporarily unavailable","data":[]}';
            # Если нужно «жёстко» сигнализировать — замените на `return 503 ...`
        }
    }
}
